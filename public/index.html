<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Rex / Browser</title><style>
*{box-sizing:border-box}body{margin:0;background:#111512;color:#dce7dc;font:14px system-ui}header{padding:24px 32px;border-bottom:1px solid #334035;display:flex;gap:20px;align-items:center}h1{font-size:19px;margin:0;margin-right:auto}select,button,textarea{background:#202920;color:inherit;border:1px solid #4a5e4b;border-radius:5px;padding:10px;font:inherit}main{padding:24px 32px}#screen{height:65vh;overflow:auto;font:14px/1.5 monospace;white-space:pre;margin:0;outline:none}#screen:focus{box-shadow:inset 3px 0 #9ac898}#status{color:#9eaf9e;margin-bottom:20px}footer{border-top:1px solid #334035;padding:20px 32px;display:flex;gap:12px}textarea{flex:1;resize:vertical}small{color:#9eaf9e}label{display:flex;align-items:center;gap:8px}header{flex-wrap:wrap;gap:10px}select{max-width:260px}#screen{position:relative;height:65vh;min-height:360px;overflow:hidden}.pane{position:absolute;padding:3px;display:flex;flex-direction:column;border:1px solid #334035;min-width:0;min-height:0}.pane.active{border-color:#9ac898}.pane button{padding:5px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;border-radius:0}.pane pre{flex:1;min-height:0;overflow:auto;margin:0;padding:8px;font:14px/1.5 monospace;white-space:pre;outline:none}#feedback{padding:0 32px 10px;min-height:28px}button:disabled{opacity:.5}</style></head><body>
<header><h1>Rex <small>/ browser prototype</small></h1><select id="host" aria-label="Computer"></select><select id="session"><option>Select session</option></select><select id="tab" aria-label="Tab"></select><select id="block"><option>Select pane</option></select><button id="new-tab">New tab</button><button id="refresh">Refresh</button><label><input id="input" type="checkbox">Direct typing</label></header>
<main><div id="status">Loading official Ghostty WASM…</div><div id="screen" aria-label="Terminal panes"></div><small>Snapshot preview · official libghostty-vt 1.0.1 · click terminal to type after enabling input</small></main>
<div id="feedback" role="status" aria-live="polite"></div><footer><textarea id="command" rows="2" placeholder="Text or command to send to selected pane"></textarea><button id="send">Send + Enter</button></footer><script>window.rexToken='__TOKEN__'</script><script type="module" src="/client.js"></script></body></html>
